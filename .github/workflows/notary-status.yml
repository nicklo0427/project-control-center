name: Apple Notarization Status

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Apple notarization Submission ID
        required: true
        type: string
      label:
        description: Human-readable artifact label
        required: false
        default: Project Control Center.app
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Validate Submission ID
        shell: bash
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SUBMISSION_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "Invalid Apple notarization Submission ID format." >&2
            exit 1
          fi

      - name: Prepare notarization key
        shell: bash
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_BASE64"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Query Apple Notary service
        id: notary
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          ARTIFACT_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          INFO_PATH="$RUNNER_TEMP/notary-info.json"
          xcrun notarytool info "$SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json > "$INFO_PATH"

          STATUS="$(jq -r '.status // "Unknown"' "$INFO_PATH")"
          CREATED_AT="$(jq -r '.createdDate // "Unknown"' "$INFO_PATH")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Apple notarization status ($ARTIFACT_LABEL): $STATUS"
          echo "Submission ID: $SUBMISSION_ID"

          {
            echo "## Apple notarization status"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Artifact | $ARTIFACT_LABEL |"
            echo "| Submission ID | \`$SUBMISSION_ID\` |"
            echo "| Status | **$STATUS** |"
            echo "| Created | $CREATED_AT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$STATUS" == "Invalid" ]]; then
            LOG_PATH="$RUNNER_TEMP/notary-log.json"
            if xcrun notarytool log "$SUBMISSION_ID" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" > "$LOG_PATH"; then
              echo "log_available=true" >> "$GITHUB_OUTPUT"
            else
              echo "log_available=false" >> "$GITHUB_OUTPUT"
              echo "Apple returned Invalid, but its diagnostic log is not available yet." >&2
            fi
          else
            echo "log_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Apple diagnostic log
        if: steps.notary.outputs.log_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apple-notarization-log-${{ inputs.submission_id }}
          path: ${{ runner.temp }}/notary-log.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail rejected submission
        if: steps.notary.outputs.status == 'Invalid'
        shell: bash
        run: |
          echo "Apple rejected notarization Submission ID ${{ inputs.submission_id }}." >&2
          exit 1
