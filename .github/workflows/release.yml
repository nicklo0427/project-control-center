name: Release macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v$PACKAGE_VERSION" = "$GITHUB_REF_NAME"

      - name: Prepare notarization key
        shell: bash
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_BASE64"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate Apple Notary credentials
        timeout-minutes: 5
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcrun notarytool history --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > /dev/null
          echo "Apple Notary credentials are valid."

      - name: Build signed notarized Universal DMG
        timeout-minutes: 60
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_NOTARY_TIMEOUT: 45m
        run: npm run release:mac

      - name: Notarize and staple DMG
        timeout-minutes: 60
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_NOTARY_TIMEOUT: 45m
        run: |
          set -euo pipefail
          DMG_PATH="$(find release -type f -name 'Project-Control-Center-*-universal.dmg' -print -quit)"
          test -n "$DMG_PATH"
          node scripts/notarize-macos.mjs "$DMG_PATH" "Project Control Center DMG"

      - name: Verify app and DMG
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -type d -name 'Project Control Center.app' -print -quit)"
          DMG_PATH="$(find release -type f -name 'Project-Control-Center-*-universal.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/Project Control Center")"
          grep -qw x86_64 <<< "$ARCHS"
          grep -qw arm64 <<< "$ARCHS"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "$(dirname "$DMG_PATH")/SHA256SUMS.txt"

      - name: Upload preflight artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Project-Control-Center-${{ github.sha }}-preflight
          path: |
            release/*/Project-Control-Center-*-universal.dmg
            release/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find release -type f -name 'Project-Control-Center-*-universal.dmg' -print -quit)"
          CHECKSUM_PATH="$(dirname "$DMG_PATH")/SHA256SUMS.txt"
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH" "$CHECKSUM_PATH" --verify-tag --generate-notes --title "Project Control Center $GITHUB_REF_NAME"
