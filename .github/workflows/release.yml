name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev

      - name: Prepare notarization key
        shell: bash
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_BASE64"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          /usr/bin/base64 --decode <<< "$API_KEY_BASE64" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build signed notarized Universal DMG
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run release:mac

      - name: Verify app and DMG
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -type d -name 'Project Control Center.app' -print -quit)"
          DMG_PATH="$(find release -type f -name 'Project-Control-Center-*-universal.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/Project Control Center")" = "x86_64 arm64"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "$(dirname "$DMG_PATH")/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find release -type f -name 'Project-Control-Center-*-universal.dmg' -print -quit)"
          CHECKSUM_PATH="$(dirname "$DMG_PATH")/SHA256SUMS.txt"
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH" "$CHECKSUM_PATH" --verify-tag --generate-notes --title "Project Control Center $GITHUB_REF_NAME"
